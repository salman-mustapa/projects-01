server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Service Worker & Manifest: No Cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static Media & Assets Caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|mp4|webm|pdf|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # OLabs Reverse Proxy for Docker Environment (Bypasses X-Frame-Options & CSP)
    location /olabs-proxy/ {
        proxy_pass https://www.olabs.edu.in/;
        proxy_set_header Host www.olabs.edu.in;
        proxy_set_header Referer https://www.olabs.edu.in/;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "ALLOWALL" always;
    }

    # SPA / HTML Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
